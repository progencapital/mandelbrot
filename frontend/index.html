<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Interactive Mandelbrot Set Explorer — GPU-accelerated fractal rendering">
    <meta name="theme-color" content="#060910">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mandelbrot">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#060910">
    <meta name="format-detection" content="telephone=no">
    <title>Mandelbrot Explorer</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="loading">
    <div class="ld-name">MANDELBROT</div>
    <div class="ld-sub">FRACTAL EXPLORER</div>
    <div class="ld-bg"><div class="ld-bar" id="ldBar"></div></div>
</div>

<canvas id="canvas"></canvas>

<div id="header">
    <div class="brand">MANDEL<em>BROT</em></div>
    <div class="vd"></div>

    <div class="ibtn" id="resetBtn" title="Reset to overview (R)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
        </svg>
    </div>

    <div class="ibtn" id="autoBtn" title="Auto-zoom drift (A)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
    </div>

    <div class="ibtn" id="fsBtn" title="Fullscreen (F)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
    </div>

    <div class="vd"></div>

    <div class="iter-wrap">
        <span>ITER</span>
        <input type="range" id="iterSlider" min="64" max="2048" step="32" value="256">
        <span class="iter-val" id="iterVal">256</span>
    </div>

    <div class="vd"></div>

    <div class="poi-wrap" id="poiWrap">
        <div class="poi-trigger" id="poiTrigger">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span id="poiLabel">DESTINATIONS</span>
            <svg class="chevron" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </div>
        <div class="poi-panel" id="poiPanel"></div>
    </div>

    <div class="vd"></div>

    <div class="ibtn" id="coordBtn" title="Go to coordinates (G)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="10" r="3"/><path d="M12 21.7C17.3 17 20 13 20 10a8 8 0 1 0-16 0c0 3 2.7 7 8 11.7z"/>
        </svg>
    </div>
</div>

<div id="coordPanel" class="coord-panel">
    <div class="coord-title">GO TO COORDINATES</div>
    <div class="coord-grid">
        <label>Real (X)<input type="number" id="inRe" step="any" value="-0.5"></label>
        <label>Imag (Y)<input type="number" id="inIm" step="any" value="0"></label>
        <label>Zoom<input type="number" id="inZ" step="any" min="0.15" value="0.42"></label>
        <button id="btnGo" class="btn-go">Navigate</button>
    </div>
</div>

<div id="uiToggle" title="Toggle UI (U)">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
        <path d="M17 8l-5-5-5 5"/><path d="M17 16l-5 5-5-5"/>
    </svg>
</div>

<div id="footer">
    <span class="stat"><b>X </b><span id="stX">-0.50000000</span></span>
    <span class="stat"><b>Y </b><span id="stY">0.00000000</span></span>
    <span class="stat"><b>Z </b><span id="stZ">0.42×</span></span>
    <span class="stat"><b>ITER </b><span id="stIter">256</span></span>
    <span class="hint-txt">scroll · drag · pinch &middot; <kbd>?</kbd> keys</span>
</div>

<div id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
