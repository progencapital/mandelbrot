services:
  mandelbrot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mandelbrot-explorer
    ports:
      - "${MANDELBROT_PORT:-8080}:8080"
    environment:
      - MANDELBROT_HOST=0.0.0.0
      - MANDELBROT_PORT=8080
      - MANDELBROT_STATIC_DIR=/app/frontend/dist
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
