[package]
name = "mandelbrot-wasm"
version = "1.0.0"
edition = "2021"
description = "High-performance Mandelbrot set computation in WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
