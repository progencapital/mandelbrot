[package]
name = "mandelbrot-server"
version = "1.0.0"
edition = "2021"
description = "Production web server for Mandelbrot explorer"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-cors = "0.7"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
